name: 작품 수집

# ══════════════════════════════════════════════════════════════════
#  ★ 2026-08-23 · <클리블랜드(cma)>를 더했습니다. 도판이 실제로 뜨는 것을
#    확인용 화면(tools/cma-proof.html)에서 눈으로 보고 붙였습니다.
#    한국 443 · 중국 2,478 · 일본 3,237 (CC0 · 도판 있음)
#  ★ 예약 실행을 met → cma 로 바꿉니다. 우리가 실제로 쓸 수 있는 도판이
#    가장 많이 나오는 자료원입니다.
#  ★ 메트로폴리탄 공개 API 에서 작품과 도판을 받습니다.
#    퍼블릭 도메인만 도판을 싣고, 저작권이 있는 것은 소장처로만 잇습니다.
#  ★ 예약 실행 때 값이 비어 오지 않게 기본값을 못박습니다.
# ══════════════════════════════════════════════════════════════════

on:
  schedule:
    - cron: '40 19 * * *'      # 한국 시간 새벽 4시 40분
  workflow_dispatch:
    inputs:
      src:
        description: '어디서 받을까요'
        type: choice
        default: cma
        options: [seoul-peek, gongu-fill, gongu, gongu-peek, commons-cat, commons-catpeek, commons, commons-peek, cma, cma-peek, emuseum-peek, emuseum, met, aic, aic-peek, si, si-peek, nga, nga-peek, school-wiki, school-wiki-peek, school-wiki-redo-cut, exh-aic-artists, exh-aic-artists-peek, papers-openalex-peek, papers-openalex-kr-peek, papers-openalex, papers-openalex-kr, gokams-peek, groups-gokams-peek-small, groups-gokams-peek-full, groups-gokams, datagokr-peek]
      q:
        description: '무엇으로 찾을까요 (예: Korea, landscape)'
        default: 'Korea'
      dept:
        description: '부서 (메트는 번호 · 클리블랜드는 이름 예: Korean Art · 비우면 전부)'
        default: ''
      limit:
        description: '부서마다 몇 점까지'
        default: '8000'
      dry:
        description: '담지 않고 세어만 보기'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: collect-works
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 받아서 쌓기
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DATA_GO_KEY:          ${{ secrets.DATA_GO_KEY }}
          GONGU_KEY:            ${{ secrets.GONGU_KEY }}
          SEOUL_KEY:            ${{ secrets.SEOUL_KEY }}
          SMITHSONIAN_KEY:      ${{ secrets.SMITHSONIAN_KEY }}
          EMUSEUM_URL:          ${{ vars.EMUSEUM_URL }}
          IN_SRC:   ${{ github.event.inputs.src   || 'cma' }}
          IN_Q:     ${{ github.event.inputs.q     || 'Korea' }}
          IN_DEPT:  ${{ github.event.inputs.dept  || '' }}
          IN_LIMIT: ${{ github.event.inputs.limit || '8000' }}
          IN_DRY:   ${{ github.event.inputs.dry   || 'false' }}
        run: |
          # ★ 2026-09-29 · 실행 화면을 파일로도 남깁니다 — blob storage
          #   가 막힌 환경에서 GitHub API(issue 댓글)로 다시 읽으려는
          #   용도입니다. 아래 <si 결과 알리기> 단계와 짝입니다.
          exec > >(tee /tmp/run-output.txt) 2>&1
          # ★ 2026-08-22 · 시카고는 Cloudflare 로 바깥 접근을 막습니다.
          #   도판도 안 오고 소장처 링크도 차단됩니다.
          # ★ 2026-08-23 · 예약 실행을 <클리블랜드>로 둡니다.
          #   도판이 뜨는 것을 눈으로 확인한 자료원입니다.
          case "${IN_SRC:-cma}" in
            seoul-peek)
              # ★ 서울 열린데이터광장 — 닿는지·무엇을 주는지만 봅니다.
              #   담는 코드가 한 줄도 없습니다.
              # ★★ 2026-08-24 · <전시 담기>는 <b>collect-exh.yml 로 옮겼습니다.</b>
              #   전시는 때가 있는 자료라 날마다 따로 돌아야 하고,
              #   한 일이 두 곳에 있으면 어느 것이 도는지 헷갈립니다.
              echo "▶ 서울 열린데이터광장을 두드려 봅니다 (담지 않습니다)"
              node scripts/collect-seoul-peek.mjs
              ;;
            gongu-fill)
              # ★ 이미 담긴 공유마당 작품의 <빈 칸>을 상세로 채웁니다.
              #   재료·연도·크기·소장처 — 캡션의 아래 두 줄입니다.
              # ★ 건마다 한 번씩 물으므로 느립니다. 조금씩 나누어
              #   여러 번 돌리십시오 — 이미 채운 것은 건너뜁니다.
              ARGS="--fill --limit ${IN_LIMIT:-800}"
              if [ "${IN_DRY}" = "true" ]; then ARGS="$ARGS --dry"; fi
              echo "▶ node scripts/collect-works-gongu.mjs $ARGS"
              eval node scripts/collect-works-gongu.mjs $ARGS
              ;;
            gongu)
              # ★ 공유마당 — <만료(97)>만 받습니다.
              #   200줄씩 세어 보니 97 은 100% 가 한국 고전미술이고
              #   98·01·21 은 0% (일러스트·달력·다이어리·스티커)였습니다.
              # ★ sql/gongu-14-B-apply.sql 을 먼저 돌려야 합니다.
              ARGS="--limit ${IN_LIMIT:-8000}"
              if [ "${IN_DRY}" = "true" ]; then ARGS="$ARGS --dry"; fi
              echo "▶ node scripts/collect-works-gongu.mjs $ARGS"
              eval node scripts/collect-works-gongu.mjs $ARGS
              ;;
            gongu-peek)
              # ★ 공유마당 — 닿는지 · 도판이 뜨는지부터 봅니다.
              #   api.kcisa.kr 이 GitHub 서버에서 못 닿았던 전례가 있습니다.
              echo "▶ 공유마당을 두드려 봅니다 (담지 않습니다)"
              node scripts/collect-works-gongu.mjs --peek
              ;;
            commons-cat)
              # ★ 커먼즈 <분류>에서 그림을 거둡니다. 저작권이 풀린
              #   작가(죽은 지 70년 넘음)만 다룹니다.
              # ★ sql/link-12-B-apply.sql 을 먼저 돌려야 합니다.
              ARGS="--cat"
              if [ "${IN_DRY}" = "true" ]; then ARGS="$ARGS --dry"; fi
              echo "▶ node scripts/collect-works-commons.mjs $ARGS"
              eval node scripts/collect-works-commons.mjs $ARGS
              ;;
            commons-catpeek)
              echo "▶ 커먼즈 <분류>에 무엇이 들어 있는지 있는 그대로 봅니다 (담지 않습니다)"
              node scripts/collect-works-commons.mjs --catpeek
              ;;
            commons-peek)
              echo "▶ 우리 작가의 작품이 커먼즈에 얼마나 있는지 봅니다 (담지 않습니다)"
              node scripts/collect-works-commons.mjs --peek
              ;;
            commons)
              # ★ 작품에서 작가를 찾는 것이 아니라, <우리 작가에게서
              #   출발해> 그 사람의 작품을 받습니다. 받는 순간 이미
              #   이어져 있어 잇기 문제가 생기지 않습니다.
              # ★ sql/link-11-B-apply.sql 을 먼저 돌려야 합니다.
              ARGS="--limit ${IN_LIMIT:-8000}"
              if [ "${IN_DRY}" = "true" ]; then ARGS="$ARGS --dry"; fi
              echo "▶ node scripts/collect-works-commons.mjs $ARGS"
              eval node scripts/collect-works-commons.mjs $ARGS
              ;;
            cma-peek)
              echo "▶ 클리블랜드가 주는 칸 이름을 봅니다 (담지 않습니다)"
              node scripts/collect-works-cma.mjs --peek
              ;;
            cma)
              # ★ 부서를 비우면 한국·중국·일본 셋을 차례로 받습니다.
              #   인도·동남아(3,377점)는 일부러 뺐습니다 — 한국 미술을
              #   읽는 맥락 밖입니다. 넣으려면 dept 에 이름을 적으십시오.
              ARGS="--limit ${IN_LIMIT:-8000}"
              if [ -n "${IN_DEPT}" ]; then ARGS="$ARGS --dept \"${IN_DEPT}\""; fi
              if [ "${IN_DRY}" = "true" ]; then ARGS="$ARGS --dry"; fi
              echo "▶ node scripts/collect-works-cma.mjs $ARGS"
              eval node scripts/collect-works-cma.mjs $ARGS
              ;;
            emuseum-peek)
              echo "▶ 국내 유물 자료원이 주는 칸 이름을 봅니다"
              node scripts/collect-works-emuseum.mjs --peek
              ;;
            emuseum)
              ARGS="--limit ${IN_LIMIT:-300}"
              if [ -n "${IN_Q}" ] && [ "${IN_Q}" != "Korea" ]; then ARGS="$ARGS --q \"${IN_Q}\""; fi
              if [ "${IN_DRY}" = "true" ]; then ARGS="$ARGS --dry"; fi
              echo "▶ node scripts/collect-works-emuseum.mjs $ARGS"
              eval node scripts/collect-works-emuseum.mjs $ARGS
              ;;
            aic-peek)
              echo "▶ 시카고가 주는 칸 이름을 봅니다"
              node scripts/collect-works-aic.mjs --peek
              ;;
            si-peek)
              # ★ 2026-09-29 · <부서> 칸에 유닛 코드를 적으면 그 기관을 봅니다
              #   (SAAM · NMAA · NPG · CHNDM · HMSG · NMAfA · NMAI · NMAAHC).
              #   비우면 SAAM. <무엇으로 찾을까요> 칸은 이제 이어받기용
              #   시작 번호(--start)입니다 — 숫자를 적으면 그 자리부터 봅니다.
              #   ★ NMAI·NMAAHC 는 회화·판화·조각만 스크립트 안에서 거릅니다
              #   (API 쪽 object_type 필터는 들쭉날쭉해 뺐습니다 — 위 .mjs 주석).
              SI_UNIT="${IN_DEPT:-SAAM}"
              SI_START_ARGS=""
              if [ -n "${IN_Q}" ] && [ "${IN_Q}" != "Korea" ]; then SI_START_ARGS="--start ${IN_Q}"; fi
              echo "▶ 스미소니언(${SI_UNIT})이 주는 칸 이름을 봅니다"
              eval node scripts/collect-works-smithsonian.mjs --unit "${SI_UNIT}" --peek $SI_START_ARGS
              ;;
            si)
              # ★ 2026-09-29 · 파트너가 api.data.gov 열쇠를 직접 받아 붙임.
              #   기본은 SAAM(미국 미술관). 다른 미술 계열 유닛을 받으려면
              #   <부서> 칸에 코드를 적으십시오 — NMAA(국립아시아미술관·구
              #   프리어|새클러) · NPG(초상화) · CHNDM(쿠퍼휴잇 디자인) ·
              #   HMSG(허시혼·현대미술) · NMAfA(아프리카미술) · NMAI(원주민·
              #   민속박물관 · 143K건이라 <무엇으로 찾을까요> 칸에 이어받을
              #   시작 번호를 적어 나눠 돌림 · 회화/판화/조각만 자동으로 거름)
              #   · NMAAHC(흑인역사문화박물관 · 마찬가지로 자동으로 거름).
              SI_UNIT="${IN_DEPT:-SAAM}"
              SI_START_ARGS=""
              if [ -n "${IN_Q}" ] && [ "${IN_Q}" != "Korea" ]; then SI_START_ARGS="--start ${IN_Q}"; fi
              ARGS="--unit ${SI_UNIT} --limit ${IN_LIMIT:-2000} $SI_START_ARGS"
              if [ "${IN_DRY}" = "true" ]; then ARGS="$ARGS --dry"; fi
              echo "▶ node scripts/collect-works-smithsonian.mjs $ARGS"
              eval node scripts/collect-works-smithsonian.mjs $ARGS
              ;;
            nga-peek)
              # ★ 2026-09-29 · 내셔널갤러리(워싱턴) — 열쇠가 필요 없습니다.
              #   소장품 전체를 깃허브에 CSV 로 공개해 둡니다(CC0).
              echo "▶ 내셔널갤러리 데이터를 우리 표로 바꾼 모습을 봅니다 (담지 않습니다)"
              node scripts/collect-works-nga.mjs --peek
              ;;
            nga)
              # ★ 열린-접근 도판이 있는 작품 63,858점(전체 소장품 중) ·
              #   한 번에 다 받아도 몇 분이면 끝납니다(로컬 CSV 처리라
              #   API 호출·속도제한이 없습니다). <무엇으로 찾을까요> 칸은
              #   이어받을 시작 번호(--start)로 씁니다 — si 와 같은 결.
              NGA_START_ARGS=""
              if [ -n "${IN_Q}" ] && [ "${IN_Q}" != "Korea" ]; then NGA_START_ARGS="--start ${IN_Q}"; fi
              ARGS="--limit ${IN_LIMIT:-200000} $NGA_START_ARGS"
              if [ "${IN_DRY}" = "true" ]; then ARGS="$ARGS --dry"; fi
              echo "▶ node scripts/collect-works-nga.mjs $ARGS"
              eval node scripts/collect-works-nga.mjs $ARGS
              ;;
            school-wiki-peek)
              # ★ 2026-10-01 · 미술학교 소개문 채우기 — 한 곳만 살펴봅니다.
              #   <무엇으로 찾을까요> 칸에 "debug"를 적으면 실패 까닭을
              #   그대로 찍습니다.
              echo "▶ 위키백과에서 한 곳만 받아 봅니다 (담지 않습니다)"
              if [ "${IN_Q}" = "debug" ]; then export DEBUG=1; fi
              node scripts/enrich-schools-wiki.mjs --peek
              ;;
            school-wiki)
              # ★ 2026-10-01 · 한국 101곳(소개문 0곳)·해외 29곳(소개문 빔)을
              #   위키백과(ko/en)에서 받아 <빈칸만> 채웁니다. <무엇으로
              #   찾을까요> 칸에 "debug"를 적으면 실패 까닭을 그대로
              #   찍습니다 — 평소엔 비워 두십시오(소개문이 빈 곳을 표에서
              #   직접 골라 오므로 찾는 말이 따로 필요 없습니다).
              ARGS="--limit ${IN_LIMIT:-400}"
              if [ "${IN_DRY}" = "true" ]; then ARGS="$ARGS --dry"; fi
              if [ "${IN_Q}" = "debug" ]; then export DEBUG=1; fi
              echo "▶ node scripts/enrich-schools-wiki.mjs $ARGS"
              eval node scripts/enrich-schools-wiki.mjs $ARGS
              ;;
            school-wiki-redo-cut)
              # ★ 2026-10-01 · 파트너가 경기대학교 조형대학에서 "소개문이
              #   문장 중간에서 끊겼다"고 지적 — 예전엔 1200자에서 무조건
              #   잘랐던 탓입니다. 이제 자르지 않게 고쳤고, 이미 끊겨
              #   담긴 곳을 다시 받아 bio 만 덮어씁니다.
              ARGS="--redo-cut --limit ${IN_LIMIT:-400}"
              if [ "${IN_DRY}" = "true" ]; then ARGS="$ARGS --dry"; fi
              if [ "${IN_Q}" = "debug" ]; then export DEBUG=1; fi
              echo "▶ node scripts/enrich-schools-wiki.mjs $ARGS"
              eval node scripts/enrich-schools-wiki.mjs $ARGS
              ;;
            exh-aic-artists-peek)
              # ★ 2026-10-01 · 시카고미술관 전시 참여작가 — 한 곳만 살펴봅니다.
              echo "▶ AIC 전시 하나로 artist_ids→이름 흐름을 살펴봅니다 (담지 않습니다)"
              node scripts/enrich-exh-aic-artists.mjs --peek
              ;;
            exh-aic-artists)
              # ★ 2026-10-01 · aicExh 전시 6,259건 중 exhibition_artists 가
              #   아직 없는 것만 골라, AIC artist_ids 를 이름으로 바꿔 채웁니다.
              ARGS="--limit ${IN_LIMIT:-7000}"
              if [ "${IN_DRY}" = "true" ]; then ARGS="$ARGS --dry"; fi
              echo "▶ node scripts/enrich-exh-aic-artists.mjs $ARGS"
              eval node scripts/enrich-exh-aic-artists.mjs $ARGS
              ;;
            papers-openalex-peek)
              echo "▶ OpenAlex 에서 미술 subfield 논문 숫자·상위 인용 10건을 봅니다 (담지 않습니다)"
              node scripts/collect-papers-openalex.mjs --peek
              ;;
            papers-openalex-kr-peek)
              echo "▶ OpenAlex 에서 한국 소속 저자로 좁힌 미술 subfield 논문 숫자·상위 인용 10건을 봅니다 (담지 않습니다)"
              node scripts/collect-papers-openalex.mjs --peek --kr-only
              ;;
            papers-openalex)
              # ★ 2026-10-01 · 전세계 미술 subfield 논문 — 인용 많은 순으로 받습니다.
              ARGS="--limit ${IN_LIMIT:-2000}"
              if [ "${IN_DRY}" = "true" ]; then ARGS="$ARGS --dry"; fi
              echo "▶ node scripts/collect-papers-openalex.mjs $ARGS"
              eval node scripts/collect-papers-openalex.mjs $ARGS
              ;;
            papers-openalex-kr)
              # ★ 2026-10-01 · 저자 소속 기관 중 하나라도 한국인 논문만.
              ARGS="--limit ${IN_LIMIT:-2000} --kr-only"
              if [ "${IN_DRY}" = "true" ]; then ARGS="$ARGS --dry"; fi
              echo "▶ node scripts/collect-papers-openalex.mjs $ARGS"
              eval node scripts/collect-papers-openalex.mjs $ARGS
              ;;
            gokams-peek)
              echo "▶ GOKAMS 미술단체 용어사전 목록 페이지 구조를 봅니다 (담지 않습니다)"
              node scripts/peek-gokams.mjs
              ;;
            groups-gokams-peek-small)
              echo "▶ GOKAMS 500~560번을 훑어 뽑아내는 글자가 맞는지 봅니다 (담지 않습니다)"
              node scripts/collect-groups-gokams.mjs --peek --all --start 500 --end 560
              ;;
            groups-gokams-peek-full)
              echo "▶ GOKAMS 1~1800번을 다 훑어 분류별 건수를 봅니다 (담지 않습니다)"
              node scripts/collect-groups-gokams.mjs --peek --all --start 1 --end 1800
              ;;
            datagokr-peek)
              echo "▶ data.go.kr 문화예술교육 단체 목록 다운로드 주소를 봅니다 (담지 않습니다)"
              node scripts/peek-datagokr.mjs
              ;;
            groups-gokams)
              # ★ 2026-10-01 · 「협회/단체」 분류만 담습니다(기본). --all 을
              #   dept 칸에 적으면 전체 분류를 담습니다.
              ARGS="--start 1 --end 1800"
              if [ "${IN_DEPT}" = "all" ]; then ARGS="$ARGS --all"; fi
              if [ "${IN_DRY}" = "true" ]; then ARGS="$ARGS --dry"; fi
              echo "▶ node scripts/collect-groups-gokams.mjs $ARGS"
              eval node scripts/collect-groups-gokams.mjs $ARGS
              ;;
            met)
              ARGS="--q \"${IN_Q:-Korea}\" --limit ${IN_LIMIT:-300}"
              if [ -n "${IN_DEPT}" ]; then ARGS="$ARGS --dept ${IN_DEPT}"; fi
              if [ "${IN_DRY}" = "true" ]; then ARGS="$ARGS --dry"; fi
              echo "▶ node scripts/collect-works-met.mjs $ARGS"
              eval node scripts/collect-works-met.mjs $ARGS
              ;;
            *)
              ARGS="--q \"${IN_Q:-Korea}\" --limit ${IN_LIMIT:-300}"
              if [ "${IN_DRY}" = "true" ]; then ARGS="$ARGS --dry"; fi
              echo "▶ node scripts/collect-works-aic.mjs $ARGS"
              eval node scripts/collect-works-aic.mjs $ARGS
              ;;
          esac

      - name: si 결과 알리기
        # ★ 2026-09-29 · blob storage(actions log)가 사방넷에서 막혀
        #   있어 이슈 댓글로 결과를 옮깁니다. si/si-peek·nga/nga-peek 일
        #   때만, 늘(성공·실패 상관없이) 답니다. 확인 끝나면 지워도 됩니다.
        if: always() && contains(fromJSON('["si","si-peek","nga","nga-peek","school-wiki","school-wiki-peek","school-wiki-redo-cut","exh-aic-artists","exh-aic-artists-peek","papers-openalex-peek","papers-openalex-kr-peek","papers-openalex","papers-openalex-kr","gokams-peek","groups-gokams-peek-small","groups-gokams-peek-full","groups-gokams","datagokr-peek"]'), github.event.inputs.src)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let out = '(출력을 못 읽었습니다)';
            try { out = fs.readFileSync('/tmp/run-output.txt', 'utf8'); } catch (e) {}
            if (out.length > 60000) out = '…(앞부분 생략)…\n' + out.slice(-60000);
            const title = 'si 디버그 로그';
            const body = [
              '실행: ' + context.serverUrl + '/' + context.repo.owner + '/' +
                        context.repo.repo + '/actions/runs/' + context.runId,
              '입력: src=' + (context.payload.inputs?.src || '') +
                ' dept=' + (context.payload.inputs?.dept || '') +
                ' q=' + (context.payload.inputs?.q || '') +
                ' limit=' + (context.payload.inputs?.limit || ''),
              '```',
              out,
              '```'
            ].join('\n');
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'si-debug'
            });
            const same = open.find(i => i.title === title);
            if (same) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: same.number, body });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['si-debug'] });
            }

      - name: 실패하면 알리기
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '작품 수집이 실패했습니다';
            const body  = [
              '워크플로: `' + context.workflow + '`',
              '실행: ' + context.serverUrl + '/' + context.repo.owner + '/' +
                        context.repo.repo + '/actions/runs/' + context.runId
            ].join('\n');
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'collect-fail'
            });
            const same = open.find(i => i.title === title);
            if (same) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: same.number, body });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['collect-fail'] });
            }
