name: 진단 · 위키데이터 응답 보기 (수동 · 담지 않음)

# ══════════════════════════════════════════════════════════════════
#  OPUSFINE · 진단
#  ------------------------------------------------------------------
#  ★ 한글 이름 채우기가 128명 전원 0건을 냈습니다.
#    자료가 없는 것인지 코드가 틀린 것인지 가리기 위한 것입니다.
#
#  ★ DB 를 건드리지 않습니다. Supabase 열쇠를 아예 쓰지 않습니다.
#    작가 번호를 파일에 박아 넣었고, 받은 것을 그대로 찍습니다.
#
#  ★ 원인을 찾으면 이 워크플로는 지우셔도 됩니다.
# ══════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diag-wd
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 위키데이터 응답 날것 보기
        run: node scripts/diag-wd-label.mjs
