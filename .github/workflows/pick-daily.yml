name: 운영 · SELF PR · 이달의 미술학교 (매일)

# ══════════════════════════════════════════════════════════════════
#  오퍼스클램의 pick-daily.yml 을 그대로 가져왔습니다. 매일 새벽
#  scripts/pick-daily.mjs 를 돌려 그날의 작가 한 명(daily_self_pr)과
#  이달의 학교 한 곳(monthly_school)을 자동으로 고릅니다.
# ══════════════════════════════════════════════════════════════════

on:
  schedule:
    # KST 매일 00:20 (UTC 15:20 = KST 다음날 00:20)
    - cron: '20 15 * * *'
  workflow_dispatch:
    inputs:
      fill-past:
        description: '지난 며칠을 메울까요 (비우면 오늘만 · 예: 15)'
        required: false
        default: ''
        type: string
      ymd:
        description: '그 날만 (예: 2026-10-01)'
        required: false
        default: ''
        type: string
      ym:
        description: '그 달만 (예: 2026-10)'
        required: false
        default: ''
        type: string
      only:
        description: '한쪽만'
        required: false
        default: '둘 다'
        type: choice
        options: ['둘 다', 'person', 'school']
      dry:
        description: '담지 않고 무엇을 고를지만 보기'
        required: false
        default: 'no'
        type: choice
        options: ['no', 'yes']

permissions:
  contents: read
  issues: write

concurrency:
  group: of-pick-daily
  cancel-in-progress: false

jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 자동 선정 실행
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          OPTS=""
          FP="${{ github.event.inputs.fill-past }}"
          if [ -n "$FP" ]; then OPTS="$OPTS --fill-past=$FP"; fi
          YMD="${{ github.event.inputs.ymd }}"
          if [ -n "$YMD" ]; then OPTS="$OPTS --ymd=$YMD"; fi
          YM="${{ github.event.inputs.ym }}"
          if [ -n "$YM" ]; then OPTS="$OPTS --ym=$YM"; fi
          ONLY="${{ github.event.inputs.only }}"
          if [ "$ONLY" = "person" ] || [ "$ONLY" = "school" ]; then OPTS="$OPTS --only=$ONLY"; fi
          if [ "${{ github.event.inputs.dry }}" = "yes" ]; then OPTS="$OPTS --dry"; fi

          echo "── 실행 : node scripts/pick-daily.mjs $OPTS ──"
          node scripts/pick-daily.mjs $OPTS 2>&1 | tee /tmp/run-output.txt

      - name: 실행 결과를 이슈에 남기기
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let out = '(출력을 못 읽었습니다)';
            try { out = fs.readFileSync('/tmp/run-output.txt', 'utf8'); } catch (e) {}
            if (out.length > 60000) out = '…(앞부분 생략)…\n' + out.slice(-60000);
            const title = 'si 디버그 로그';
            const body = [
              '실행: ' + context.serverUrl + '/' + context.repo.owner + '/' +
                        context.repo.repo + '/actions/runs/' + context.runId,
              '입력: pick-daily ' +
                'fill-past=' + (context.payload.inputs?.['fill-past'] || '') +
                ' ymd=' + (context.payload.inputs?.ymd || '') +
                ' ym=' + (context.payload.inputs?.ym || '') +
                ' only=' + (context.payload.inputs?.only || ''),
              '```',
              out,
              '```'
            ].join('\n');
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'si-debug'
            });
            const same = open.find(i => i.title === title);
            if (same) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: same.number, body });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['si-debug'] });
            }

      - name: 실패하면 알리기
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'SELF PR·이달의 미술학교 자동 선정이 실패했습니다';
            const body  = [
              '워크플로: `' + context.workflow + '`',
              '실행: ' + context.serverUrl + '/' + context.repo.owner + '/' +
                        context.repo.repo + '/actions/runs/' + context.runId
            ].join('\n');
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'collect-fail'
            });
            const same = open.find(i => i.title === title);
            if (same) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: same.number, body });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['collect-fail'] });
            }
