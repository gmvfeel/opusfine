<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>비밀번호 찾기 — OPUSFINE</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=&apos;http://www.w3.org/2000/svg&apos; viewBox=&apos;0 0 32 32&apos;%3E%3Crect width=&apos;32&apos; height=&apos;32&apos; fill=&apos;%23fff&apos;/%3E%3Cpath d=&apos;M5 26 C 11 9, 22 3, 28 9&apos; fill=&apos;none&apos; stroke=&apos;%2317171A&apos; stroke-width=&apos;5.5&apos; stroke-linecap=&apos;round&apos;/%3E%3Ccircle cx=&apos;26&apos; cy=&apos;25&apos; r=&apos;3.2&apos; fill=&apos;%231F4B47&apos;/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@100;200;300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="/assets/of.css">
<link rel="stylesheet" href="/assets/account.css">
  <script src="/assets/i18n.js"></script>
</head>
<body>

<div data-include="/partials/header.html"></div>

<div class="ac-bc"><a href="/">홈</a> / 이용 / 비밀번호 찾기</div>

<main class="ac-wrap">
  <div class="ac-tag">PASSWORD</div>
  <h1 class="ac-h1">비밀번호 찾기</h1>
  <p class="ac-sub">가입하신 이메일로 비밀번호 재설정 링크를 보내드립니다.</p>

  <div class="ac-box">
    <div class="ac-fg full">
      <label class="ac-fl">이메일</label>
      <input class="ac-inp" type="email" id="fp-email" placeholder="name@example.com">
    </div>
    <div class="ac-err" id="fp-msg"></div>
    <div class="ac-actions">
      <button class="btn" id="fp-btn" type="button">재설정 메일 보내기</button>
    </div>
    <div class="ac-aflinks"><a href="/account/login.html">로그인으로 돌아가기</a></div>
  </div>
</main>

<div data-include="/partials/footer.html"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/include.js"></script>
<script src="/assets/ui.js"></script>
<script src="/assets/config.js"></script>
<script src="/assets/cm-auth.js"></script>
<script src="/assets/nav.js"></script>
<script>
(function(){
  document.getElementById('fp-btn').addEventListener('click', function(){
    var el=document.getElementById('fp-email'), msg=document.getElementById('fp-msg');
    var email=(el.value||'').trim();
    msg.textContent='';
    if(!email){ msg.textContent='이메일을 입력해 주세요.'; return; }
    if(!window.CM){ msg.textContent='초기화 중입니다. 잠시 후 다시 시도해 주세요.'; return; }
    CM.sendPasswordReset(email).then(function(r){
      msg.textContent = r.ok
        ? '메일을 보냈습니다. 받은편지함을 확인해 주세요.'
        : (r.msg || '전송 중 오류가 발생했습니다.');
      msg.className = 'ac-err' + (r.ok ? ' ac-ok' : '');
    });
  });
})();
</script>
</body>
</html>
