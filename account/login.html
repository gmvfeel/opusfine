<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>로그인 — OPUSFINE</title>
<meta name="description" content="오퍼스파인 로그인.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=&apos;http://www.w3.org/2000/svg&apos; viewBox=&apos;0 0 32 32&apos;%3E%3Crect width=&apos;32&apos; height=&apos;32&apos; fill=&apos;%23fff&apos;/%3E%3Cpath d=&apos;M5 26 C 11 9, 22 3, 28 9&apos; fill=&apos;none&apos; stroke=&apos;%2317171A&apos; stroke-width=&apos;5.5&apos; stroke-linecap=&apos;round&apos;/%3E%3Ccircle cx=&apos;26&apos; cy=&apos;25&apos; r=&apos;3.2&apos; fill=&apos;%231F4B47&apos;/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@100;200;300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="/assets/of.css">
<link rel="stylesheet" href="/assets/account.css">
  <script src="/assets/i18n.js"></script>
</head>
<body>

<div data-include="/partials/header.html"></div>

<div class="ac-bc"><a href="/">홈</a> / 이용 / 로그인</div>

<main class="ac-wrap">
  <div class="ac-tag">LOGIN</div>
  <h1 class="ac-h1">로그인</h1>
  <p class="ac-sub">오퍼스파인 회원이시라면 로그인해 주세요.</p>

  <div class="ac-box">
    <div class="ac-fg full">
      <label class="ac-fl">아이디 / 이메일</label>
      <input class="ac-inp" type="text" id="lg-id" autocomplete="username" placeholder="아이디 또는 이메일">
    </div>
    <div class="ac-fg full">
      <label class="ac-fl">비밀번호</label>
      <input class="ac-inp" type="password" id="lg-pw" autocomplete="current-password" placeholder="비밀번호">
    </div>
    <div class="ac-err" id="lg-err"></div>
    <div class="ac-actions">
      <button class="btn" id="lg-btn" type="button">로그인</button>
    </div>

    <div class="ac-divider">간편 로그인</div>
    <div class="ac-soc">
      <button type="button" class="google" data-p="google"><span class="ic">G</span>Google로 계속하기</button>
      <button type="button" class="kakao" data-p="kakao"><span class="ic">K</span>카카오로 계속하기</button>
    </div>

    <div class="ac-aflinks">
      <a href="/account/find-pw.html">비밀번호 찾기</a>
      <span>·</span>
      <a href="/account/join.html">회원가입</a>
    </div>
  </div>
</main>

<div data-include="/partials/footer.html"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/include.js"></script>
<script src="/assets/ui.js"></script>
<script src="/assets/config.js"></script>
<script src="/assets/cm-auth.js"></script>
<script src="/assets/nav.js"></script>
<script>
(function(){
  var idEl=document.getElementById('lg-id'), pwEl=document.getElementById('lg-pw'), errEl=document.getElementById('lg-err');

  /* 소셜 로그인으로 돌아온 경우(또는 이미 로그인된 채 이 화면에 온 경우)
     — community_members 에 내 줄이 있으면 바로 넘어가고, 없으면(처음 온
     소셜 계정) 정보 입력 화면으로 보냅니다. */
  function checkExisting(){
    if (!window.CM) return setTimeout(checkExisting, 80);
    CM.session().then(function(ses){
      if (!ses) return;
      CM.me().then(function(row){
        if (row && row.status !== 'withdrawn') location.href = CM.nextUrl();
        else if (!row) location.href = '/account/social-complete.html';
      });
    });
  }
  checkExisting();

  function doLogin(){
    errEl.textContent=''; errEl.className='ac-err';
    var id=(idEl.value||'').trim(), pw=pwEl.value;
    if(!id||!pw){ errEl.textContent='아이디와 비밀번호를 입력해 주세요.'; return; }
    if(!window.CM){ errEl.textContent='초기화 중입니다. 잠시 후 다시 시도해 주세요.'; return; }
    CM.login(id, pw).then(function(r){
      if(!r.ok){ errEl.textContent=r.msg; return; }
      location.href = CM.nextUrl();
    });
  }
  document.getElementById('lg-btn').addEventListener('click', doLogin);
  pwEl.addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });
  idEl.addEventListener('keydown', function(e){ if(e.key==='Enter') pwEl.focus(); });
  document.querySelectorAll('.ac-soc [data-p]').forEach(function(b){
    b.addEventListener('click', function(){ if(window.CM) CM.social(b.getAttribute('data-p')); });
  });
})();
</script>
</body>
</html>
