<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>비밀번호 재설정 — OPUSFINE</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=&apos;http://www.w3.org/2000/svg&apos; viewBox=&apos;0 0 32 32&apos;%3E%3Crect width=&apos;32&apos; height=&apos;32&apos; fill=&apos;%23fff&apos;/%3E%3Cpath d=&apos;M5 26 C 11 9, 22 3, 28 9&apos; fill=&apos;none&apos; stroke=&apos;%2317171A&apos; stroke-width=&apos;5.5&apos; stroke-linecap=&apos;round&apos;/%3E%3Ccircle cx=&apos;26&apos; cy=&apos;25&apos; r=&apos;3.2&apos; fill=&apos;%231F4B47&apos;/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@100;200;300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="/assets/of.css">
<link rel="stylesheet" href="/assets/account.css">
  <script src="/assets/i18n.js"></script>
</head>
<body>

<div data-include="/partials/header.html"></div>

<div class="ac-bc"><a href="/">홈</a> / 이용 / 비밀번호 재설정</div>

<main class="ac-wrap">
  <div class="ac-tag">PASSWORD</div>
  <h1 class="ac-h1">새 비밀번호 설정</h1>
  <p class="ac-sub">메일로 받으신 링크를 통해 들어오셨다면 새 비밀번호를 입력해 주세요.</p>

  <div class="ac-box">
    <div class="ac-fg full"><label class="ac-fl">새 비밀번호</label><input class="ac-inp" type="password" id="rp-pw" placeholder="8자 이상"></div>
    <div class="ac-fg full"><label class="ac-fl">새 비밀번호 확인</label><input class="ac-inp" type="password" id="rp-pw2" placeholder="비밀번호 재입력"></div>
    <div class="ac-err" id="rp-msg"></div>
    <div class="ac-actions">
      <button class="btn" id="rp-btn" type="button">비밀번호 변경</button>
    </div>
  </div>
</main>

<div data-include="/partials/footer.html"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/include.js"></script>
<script src="/assets/ui.js"></script>
<script src="/assets/config.js"></script>
<script src="/assets/cm-auth.js"></script>
<script src="/assets/nav.js"></script>
<script>
(function(){
  document.getElementById('rp-btn').addEventListener('click', function(){
    var pw=document.getElementById('rp-pw').value, pw2=document.getElementById('rp-pw2').value;
    var msg=document.getElementById('rp-msg'); msg.textContent='';
    if(!pw||pw.length<8){ msg.textContent='비밀번호는 8자 이상이어야 합니다.'; return; }
    if(pw!==pw2){ msg.textContent='비밀번호가 서로 다릅니다.'; return; }
    if(!window.CM){ msg.textContent='초기화 중입니다. 잠시 후 다시 시도해 주세요.'; return; }
    CM.updatePassword(pw).then(function(r){
      if(!r.ok){ msg.textContent = r.msg || '변경 중 오류가 발생했습니다. 링크가 만료되었을 수 있습니다.'; return; }
      msg.textContent='비밀번호가 변경되었습니다.'; msg.className='ac-err ac-ok';
      setTimeout(function(){ location.href='/account/login.html'; }, 1200);
    });
  });
})();
</script>
</body>
</html>
