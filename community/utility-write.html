<link rel="stylesheet" href="/assets/account.css">

  <script src="/assets/i18n.js"></script>

<body>

<div data-include="/partials/header.html"></div>

<div class="bb-bc"><a href="/">홈</a> / 커뮤니티 / <a href="/community/utility.html">자료실</a> / 글쓰기</div>

<main class="ac-wrap">
  <h1 class="ac-h1" id="bwPageTitle">자료 올리기</h1>

  <div id="bwGuard" class="bb-guard" style="display:none"></div>

  <div id="bwForm" class="bb-write-box">
    <div class="ac-fg"><label class="ac-fl">제목 <span class="req">*</span></label><input class="ac-inp" type="text" id="bw-title"></div>
    <div class="ac-fg"><label class="ac-fl">설명</label><textarea class="ac-inp" id="bw-body" rows="6" placeholder="자료에 대한 설명 (선택)"></textarea></div>
    <div class="ac-fg"><label class="ac-fl">자료 주소 <span class="req">*</span></label><input class="ac-inp" type="text" id="bw-file-url" placeholder="구글드라이브·드롭박스 등 공유 링크"></div>
    <div class="ac-fg"><label class="ac-fl">자료명</label><input class="ac-inp" type="text" id="bw-file-name" placeholder="목록·내려받기 버튼에 표시될 이름"></div>
    <div class="ac-err" id="bwErr"></div>
    <div class="ac-note-box">현재는 파일 업로드 대신 외부 공유 링크(구글드라이브 등)를 받는 방식입니다.</div>
    <div class="ac-actions">
      <a class="btn ghost" href="/community/utility.html" style="justify-content:center">취소</a>
      <button class="btn" id="bwSubmit" type="button">등록</button>
    </div>
  </div>
</main>

<div data-include="/partials/footer.html"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="/assets/ui.js"></script>
<script src="/assets/config.js"></script>
<script src="/assets/cm-auth.js"></script>
<script src="/assets/nav.js"></script>
<script>
window.__bwCfg = {
  board: 'utility',
  listPage: '/community/utility.html',
  viewPage: '/community/utility-view.html',
  fields: [
    { id: 'bw-title', col: 'title', required: true, label: '제목' },
    { id: 'bw-body', col: 'body' },
    { id: 'bw-file-url', col: 'file_url', required: true, label: '자료 주소' },
    { id: 'bw-file-name', col: 'file_name' }
  ]
};
</script>
<script src="/assets/of-board-write.js"></script>
