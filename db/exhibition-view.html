<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>전시 — OPUSFINE</title>
<meta name="description" content="전시 상세">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=&apos;http://www.w3.org/2000/svg&apos; viewBox=&apos;0 0 32 32&apos;%3E%3Crect width=&apos;32&apos; height=&apos;32&apos; fill=&apos;%23fff&apos;/%3E%3Cpath d=&apos;M5 26 C 11 9, 22 3, 28 9&apos; fill=&apos;none&apos; stroke=&apos;%2317171A&apos; stroke-width=&apos;5.5&apos; stroke-linecap=&apos;round&apos;/%3E%3Ccircle cx=&apos;26&apos; cy=&apos;25&apos; r=&apos;3.2&apos; fill=&apos;%231F4B47&apos;/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@100;200;300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="/assets/of.css">
<style>
/* ══════════════════════════════════════════════════════════════════
   전시 상세 · 2026-08-24
   ------------------------------------------------------------------
   ★ 작품 상세와 <b>같은 결</b>로 갑니다 — 왼쪽 그림, 오른쪽 사실.
     다만 전시는 <b>글이 깁니다.</b> 작품 설명은 두어 줄인데 전시는
     기획의 글이라 몇 문단씩 됩니다. 그래서 아래로 넓게 폅니다.

   ★★ <b>관람 안내는 우리가 말하지 않습니다.</b>
     시간·요금은 바뀌는 자료입니다. 우리 것이 낡으면 사람을 헛걸음
     시킵니다. 값이 있으면 보이되, <b>주최 기관 확인을 함께</b> 답니다.

   ★ 손으로 적은 견본을 두지 않습니다.
   ══════════════════════════════════════════════════════════════════ */
.bc{font-size:11.5px;color:var(--ink-3);padding:26px 0 0}
.bc a:hover{color:var(--ink)}

.top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);
  gap:56px;padding:26px 0 46px;align-items:start}
@media(max-width:900px){ .top{grid-template-columns:1fr;gap:30px} }

.po{display:block;position:relative;border:1px solid var(--rule-2);padding:16px;
  background:repeating-linear-gradient(135deg,#FDFCFA,#FDFCFA 9px,#F4F3EF 9px,#F4F3EF 18px)}
.po img{display:block;width:100%;height:auto}
.po .none{display:flex;align-items:center;justify-content:center;height:320px;
  font-size:12.5px;color:var(--ink-3)}
.pcap{font-size:11px;color:var(--ink-3);margin-top:9px;line-height:1.8}

.flag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;
  letter-spacing:.05em;padding:5px 11px;border:1px solid var(--rule)}
.flag.live{color:var(--accent);border-color:var(--accent)}
.flag.dday{color:var(--accent-2);border-color:var(--accent-2)}
.flag.soon{color:var(--ink-2)}
.flag.past{color:var(--ink-3)}

.hd h1{font-family:var(--serif);font-weight:300;font-size:clamp(26px,3.2vw,38px);
  line-height:1.35;letter-spacing:-.02em;margin:14px 0 0}
.hd .sub{font-size:15px;color:var(--ink-2);margin-top:10px;line-height:1.75}
.hd .lead{font-size:14px;color:var(--ink-2);line-height:1.95;margin-top:20px}

.facts{margin-top:26px;border-top:1px solid var(--rule);padding-top:20px;
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 28px}
@media(max-width:560px){ .facts{grid-template-columns:1fr} }
.fact .k{display:block;font-size:10px;font-weight:700;letter-spacing:.14em;
  color:var(--ink-3);text-transform:uppercase}
.fact .v{display:block;font-size:14px;margin-top:5px;line-height:1.7}
.fact .v b{font-variant-numeric:tabular-nums;font-weight:600}

.acts{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap}
.acts a{font-size:13px;font-weight:600;padding:12px 22px;border:1px solid var(--ink);
  color:var(--ink);transition:.18s}
.acts a:hover{background:var(--ink);color:#fff}
.acts a.ghost{border-color:var(--rule);color:var(--ink-2);font-weight:500}
.acts a.ghost:hover{background:transparent;border-color:var(--ink);color:var(--ink)}

.dsec{padding:40px 0;border-top:1px solid var(--rule-2)}
.dhd{display:flex;align-items:baseline;gap:12px;margin-bottom:20px}
.dhd .dt{font-family:var(--serif);font-size:20px;font-weight:500}
.dhd .dt-en{font-size:10px;letter-spacing:.16em;color:var(--ink-3);text-transform:uppercase}
.body{font-size:14.5px;line-height:2.05;color:var(--ink-2);max-width:46em;
  white-space:pre-wrap;word-break:keep-all}
.body b{color:var(--ink)}

/* 같은 곳의 다른 전시 */
.more-ex{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:26px 20px}
@media(max-width:900px){ .more-ex{grid-template-columns:repeat(2,minmax(0,1fr))} }
.mx{display:block;min-width:0}
.mx .f{display:block;border:1px solid var(--rule-2);padding:8px;
  background:repeating-linear-gradient(135deg,#FDFCFA,#FDFCFA 9px,#F4F3EF 9px,#F4F3EF 18px)}
.mx .f img{display:block;width:100%;height:auto;aspect-ratio:3/4;object-fit:cover}
.mx .f .none{display:block;height:150px}
.mx .n{display:block;font-family:var(--serif);font-size:13.5px;margin-top:9px;line-height:1.5}
.mx .d{display:block;font-size:11px;color:var(--ink-3);margin-top:3px;
  font-variant-numeric:tabular-nums}
.mx:hover .n{color:var(--accent)}

.note{font-size:11.5px;color:var(--ink-3);border:1px solid var(--rule-2);
  padding:12px 15px;line-height:1.85;margin-top:8px}
.note b{color:var(--accent-2);font-weight:600}

.empty{padding:80px 0;text-align:center;font-size:14px;color:var(--ink-3);line-height:2}

html[data-theme="dark"] .po,
html[data-theme="dark"] .mx .f{background:repeating-linear-gradient(135deg,
  #1A1A1D,#1A1A1D 9px,#212125 9px,#212125 18px)}
html[data-theme="dark"] .acts a:hover{background:var(--ink);color:var(--paper)}
</style>
</head>
<body>

<div data-include="/partials/header.html"></div>

<div class="wrap">
  <div class="bc" id="bc">
    <a href="/">홈</a> / <a href="/db/artist.html">아카이브</a> /
    <a href="/db/exhibition.html">전시</a>
  </div>

  <div id="main" hidden>
    <div class="top">
      <div>
        <span class="po" id="po"></span>
        <div class="pcap" id="pcap"></div>
      </div>

      <div class="hd">
        <span class="flag" id="flag"></span>
        <h1 id="tt"></h1>
        <div class="sub" id="sub" hidden></div>
        <div class="lead" id="lead" hidden></div>

        <div class="facts" id="facts"></div>

        <div class="acts" id="acts"></div>
      </div>
    </div>

    <!-- 전시 소개 (원문) -->
    <section class="dsec" id="sec-body" hidden>
      <div class="dhd"><span class="dt">전시 소개</span><span class="dt-en">About</span></div>
      <div class="body" id="body"></div>
      <div class="note" id="bodynote"></div>
    </section>

    <!-- 같은 곳의 다른 전시 -->
    <section class="dsec" id="sec-more" hidden>
      <div class="dhd"><span class="dt" id="moreTitle">같은 곳의 다른 전시</span>
        <span class="dt-en">More</span></div>
      <div class="more-ex" id="moreGrid"></div>
    </section>
  </div>

  <div class="empty" id="empty" hidden>
    전시를 찾지 못했습니다.<br>
    <a href="/db/exhibition.html" style="color:var(--accent)">전시 목록으로 →</a>
  </div>
</div>

<div data-include="/partials/footer.html"></div>

<script src="/assets/include.js"></script>
<script src="/assets/ui.js"></script>
<script src="/assets/config.js"></script>
<script src="/assets/nav.js"></script>
<script src="/assets/exhibition-view.js"></script>
</body>
</html>
