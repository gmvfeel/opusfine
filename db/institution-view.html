/* ══════════════════════════════════════════════════════════════════
   기관·재단 상세 · 2026-10-01 · venue-view.html 을 본떴습니다

.bc{font-size:11.5px;color:var(--ink-3)}
.bc a:hover{color:var(--ink)}
.demo-note{font-size:11.5px;color:var(--ink-3);border:1px solid var(--rule-2);
  padding:11px 14px;line-height:1.75}
.demo-note b{color:var(--accent-2);font-weight:600}

.sv-top{padding:26px 0 0}
.sv-hd{display:flex;align-items:flex-start;gap:26px;padding:22px 0 30px;
  border-bottom:1px solid var(--rule-2)}
.sv-logo{flex:0 0 92px;width:92px;height:92px;display:flex;align-items:center;
  justify-content:center;border:1px solid var(--rule-2);background:#FCFBF9;overflow:hidden;
  font-family:var(--serif);font-size:38px;color:var(--accent)}
.sv-hb{min-width:0;flex:1}
.sv-nm{font-family:var(--serif);font-weight:300;font-size:clamp(25px,3.2vw,37px);
  letter-spacing:-.025em;margin:0;line-height:1.25}
.sv-sub{margin-top:14px;font-size:12.5px;color:var(--ink-2);
  font-variant-numeric:tabular-nums}
.sv-sub i{font-style:normal;color:var(--ink-3);margin:0 8px}

.sv-sec{padding:34px 0;border-bottom:1px solid var(--rule-2)}
.sv-sk{font-size:10px;font-weight:700;letter-spacing:.18em;color:var(--ink-3);
  text-transform:uppercase;margin-bottom:16px}

.sv-cols{display:grid;grid-template-columns:minmax(0,1fr) 268px;gap:0 54px;
  padding:34px 0;border-bottom:1px solid var(--rule-2)}
.sv-main{min-width:0}
.sv-side{min-width:0}
.sv-sidein{position:sticky;top:88px}

.vw-list{display:flex;flex-direction:column}
.vw-row{display:flex;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--rule-2)}
.vw-row:first-child{border-top:0;padding-top:0}
.vw-th{flex:0 0 56px;width:56px;height:72px;background:#FCFBF9;border:1px solid var(--rule-2);overflow:hidden}
.vw-th img{width:100%;height:100%;object-fit:cover;display:block}
.vw-b{min-width:0;flex:1}
.vw-t{display:block;font-family:var(--serif);font-size:14.5px;font-weight:500;line-height:1.5}
.vw-row:hover .vw-t{color:var(--accent)}
.vw-w{display:block;font-size:11.5px;color:var(--ink-3);margin-top:4px}

.sv-facts{border:1px solid var(--rule-2);padding:20px}
.sv-fk{font-size:9.5px;font-weight:700;letter-spacing:.18em;color:var(--ink-3);
  text-transform:uppercase;margin-bottom:14px}
.sv-frow{padding:10px 0;border-top:1px solid var(--rule-2);display:block}
.sv-frow:first-of-type{border-top:0;padding-top:0}
.sv-frow .k{display:block;font-size:10.5px;color:var(--ink-3);letter-spacing:.04em}
.sv-frow .v{display:block;font-size:13px;color:var(--ink);margin-top:4px;
  line-height:1.6;font-variant-numeric:tabular-nums}

.sv-none{font-size:12.5px;color:var(--ink-3);line-height:1.85}
.sv-back{padding:26px 0 40px}
.sv-back a{font-size:13px;color:var(--ink-2)}
.sv-back a:hover{color:var(--accent)}

html[data-theme="dark"] .sv-logo{background:#1A1A1D}
html[data-theme="dark"] .vw-th{background:#1A1A1D}

@media(max-width:960px){
  .sv-cols{grid-template-columns:1fr;gap:30px 0}
  .sv-sidein{position:static}
  .sv-side{order:-1}
}
@media(max-width:640px){
  .sv-hd{flex-direction:column;gap:18px}
  .sv-logo{flex:0 0 68px;width:68px;height:68px;font-size:28px}
}
</style>
