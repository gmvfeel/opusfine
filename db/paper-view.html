/* ══════════════════════════════════════════════════════════════════
   학술 논문 상세 · 2026-10-01 · venue-view.html 을 본떴습니다
   ------------------------------------------------------------------
   ★ 논문 그 자체는 바깥(DOI)에 있습니다. 여기서는 제목·저자·학술지·
     주제·인용수를 보여 주고, 원문은 바깥으로 잇습니다.
   ══════════════════════════════════════════════════════════════════ */

.bc{font-size:11.5px;color:var(--ink-3)}
.bc a:hover{color:var(--ink)}
.demo-note{font-size:11.5px;color:var(--ink-3);border:1px solid var(--rule-2);
  padding:11px 14px;line-height:1.75}
.demo-note b{color:var(--accent-2);font-weight:600}

.sv-top{padding:26px 0 0}
.sv-hd{padding:22px 0 30px;border-bottom:1px solid var(--rule-2)}
.sv-label{font-size:10px;font-weight:700;letter-spacing:.18em;color:var(--ink-3);
  text-transform:uppercase;margin-bottom:14px}
.sv-nm{font-family:var(--serif);font-weight:300;font-size:clamp(22px,2.8vw,32px);
  letter-spacing:-.02em;margin:0;line-height:1.4}
.sv-au{margin-top:14px;font-size:14px;color:var(--ink-2);line-height:1.7}
.sv-sub{margin-top:16px;font-size:12.5px;color:var(--ink-2);
  font-variant-numeric:tabular-nums}
.sv-sub i{font-style:normal;color:var(--ink-3);margin:0 8px}
.sv-sub .oa{color:var(--accent-2);font-weight:600}

.sv-facts{border:1px solid var(--rule-2);padding:20px;margin:30px 0}
.sv-fk{font-size:9.5px;font-weight:700;letter-spacing:.18em;color:var(--ink-3);
  text-transform:uppercase;margin-bottom:14px}
.sv-frow{padding:10px 0;border-top:1px solid var(--rule-2);display:block}
.sv-frow:first-of-type{border-top:0;padding-top:0}
.sv-frow .k{display:block;font-size:10.5px;color:var(--ink-3);letter-spacing:.04em}
.sv-frow .v{display:block;font-size:13px;color:var(--ink);margin-top:4px;
  line-height:1.6;font-variant-numeric:tabular-nums}

.sv-go{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;
  padding:14px 26px;border:1px solid var(--ink);color:var(--ink);text-decoration:none;
  transition:.18s;margin-top:6px}
.sv-go:hover{background:var(--ink);color:#fff}

.sv-none{font-size:12.5px;color:var(--ink-3);line-height:1.85}
.sv-back{padding:26px 0 40px}
.sv-back a{font-size:13px;color:var(--ink-2)}
.sv-back a:hover{color:var(--accent)}

@media(max-width:640px){
  .sv-hd{padding:18px 0 24px}
}
</style>
