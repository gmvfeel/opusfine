<body>

<div data-include="/partials/header.html"></div>

<div class="bb-bc"><a href="/">홈</a> / 정보SPOT / <a href="/spot/related-sites.html">관련 사이트</a> / 글쓰기</div>

<main class="ac-wrap">
  <h1 class="ac-h1" id="bwPageTitle">관련 사이트 정보 올리기</h1>

  <div id="bwGuard" class="bb-guard" style="display:none"></div>

  <div id="bwForm" class="bb-write-box">
    <div class="ac-fg"><label class="ac-fl">사이트명 <span class="req">*</span></label><input class="ac-inp" type="text" id="bw-title"></div>
    <div class="ac-fg"><label class="ac-fl">소개 <span class="req">*</span></label><textarea class="ac-inp" id="bw-body" rows="8" placeholder="어떤 사이트인지 간단히 소개해 주세요"></textarea></div>
    <div class="ac-fg"><label class="ac-fl">사이트 주소 <span class="req">*</span></label><input class="ac-inp" type="text" id="bw-link" placeholder="https://"></div>
    <div class="ac-err" id="bwErr"></div>
    <div class="ac-actions">
      <a class="btn ghost" href="/spot/related-sites.html" style="justify-content:center">취소</a>
      <button class="btn" id="bwSubmit" type="button">등록</button>
    </div>
  </div>
</main>

<div data-include="/partials/footer.html"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
window.__bwCfg = {
  board: 'related-sites',
  listPage: '/spot/related-sites.html',
  viewPage: '/spot/related-sites-view.html',
  fields: [
    { id: 'bw-title', col: 'title', required: true, label: '사이트명' },
    { id: 'bw-body', col: 'body', required: true, label: '소개' },
    { id: 'bw-link', col: 'link_url', required: true, label: '사이트 주소' }
  ]
};
</script>
<script src="/assets/of-board-write.js"></script>
