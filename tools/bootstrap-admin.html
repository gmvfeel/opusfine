<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>관리자 계정 만들기 · OPUSFINE</title>
<link rel="icon" href="/assets/ph-logo.svg">
<style>
/* ══════════════════════════════════════════════════════════════════
   OPUSFINE · 관리자 계정 만들기(터미널 없이) · tools/bootstrap-admin.html
   ------------------------------------------------------------------
   ★ api/invite-admin.js 를 화면에서 부릅니다. 터미널을 못 쓰는 경우용.
   ★ 열쇠(COLLECT_TOKEN)를 sessionStorage 에만 둡니다 — 다른 도구와 같은 방식.
   ══════════════════════════════════════════════════════════════════ */
:root{
  --paper:#FBFAF7; --ink:#17171A; --ink-2:#5F5F64; --rule:#E5E3DC;
  --nok:#1F4B47; --gold:#A8863C; --warn:#8C3A2B;
  --serif:'Noto Serif KR',serif;
  --sans:'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:15px/1.75 var(--sans);word-break:keep-all;-webkit-font-smoothing:antialiased}
.wrap{max-width:480px;margin:0 auto;padding:30px 22px 90px}
.back{font-size:13px;color:var(--ink-2);text-decoration:none}
h1{margin:14px 0 6px;font-family:var(--serif);font-size:23px;font-weight:600}
.lede{margin:0 0 24px;font-size:13px;color:var(--ink-2);line-height:1.8}
.fg{margin:0 0 13px}
label{display:block;margin:0 0 5px;font-size:12.5px;color:var(--ink-2)}
input{width:100%;padding:10px 12px;border:1px solid var(--rule);border-radius:6px;
  font:14px/1.5 ui-monospace,Menlo,monospace;background:#fff;color:var(--ink)}
.chk{display:flex;align-items:center;gap:8px;margin:4px 0 16px;font-size:13.5px}
button{padding:10px 18px;border:1px solid var(--nok);border-radius:6px;
  background:var(--nok);color:#fff;font:600 14px/1 var(--sans);cursor:pointer}
button:disabled{opacity:.5;cursor:default}
.msg{margin:18px 0 0;padding:13px 15px;border-left:3px solid var(--gold);
  background:#FBF7EE;font-size:13px;color:#6B5A31;line-height:1.8;white-space:pre-wrap;word-break:break-all}
.msg.bad{border-left-color:var(--warn);background:#FBF0EE;color:#7A3325}
.msg.ok{border-left-color:var(--nok);background:#E9F0EE;color:#1F4B47}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/admin/">← 작업실</a>
  <h1>관리자 계정 만들기</h1>
  <p class="lede">터미널 없이, 이 화면에서 <code>api/invite-admin.js</code>를 부릅니다.
    COLLECT_TOKEN은 이 칸에만 잠깐 머물고 <b>저장소엔 들어가지 않습니다</b>
    (sessionStorage — 창을 닫으면 사라집니다).</p>

  <div class="fg">
    <label for="tok">COLLECT_TOKEN</label>
    <input id="tok" type="password" autocomplete="off">
  </div>
  <div class="fg">
    <label for="email">이메일</label>
    <input id="email" type="email" value="wixon@wixon.co.kr">
  </div>
  <div class="fg">
    <label for="pw">비밀번호</label>
    <input id="pw" type="text" value="wixon9744!">
  </div>
  <div class="fg">
    <label for="name">이름</label>
    <input id="name" type="text" value="admin">
  </div>
  <label class="chk"><input id="mkadmin" type="checkbox" checked> 관리자로 바로 올리기(is_admin=true)</label>

  <button id="go">계정 만들기</button>
  <div id="msg" class="msg hide"></div>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var saved = sessionStorage.getItem('of_collect_token');
  if (saved) $('tok').value = saved;

  $('go').addEventListener('click', async function () {
    var tok = $('tok').value.trim();
    var m = $('msg');
    if (!tok) { m.className = 'msg bad'; m.textContent = 'COLLECT_TOKEN을 넣으십시오.'; return; }
    sessionStorage.setItem('of_collect_token', tok);

    $('go').disabled = true; $('go').textContent = '만드는 중…';
    m.className = 'msg hide';
    try {
      var r = await fetch('/api/invite-admin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          token: tok,
          email: $('email').value.trim(),
          password: $('pw').value,
          name: $('name').value.trim(),
          make_admin: $('mkadmin').checked
        })
      });
      var j = await r.json();
      m.className = 'msg ' + (r.ok ? 'ok' : 'bad');
      m.textContent = 'HTTP ' + r.status + '\n' + JSON.stringify(j, null, 2);
    } catch (e) {
      m.className = 'msg bad';
      m.textContent = String(e.message || e);
    } finally {
      $('go').disabled = false; $('go').textContent = '계정 만들기';
    }
  });
})();
</script>
</body>
</html>
