<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>클리블랜드 자료원 확인 · OPUSFINE</title>
<style>
/* ══════════════════════════════════════════════════════════════
   ★★ 2026-08-23 · 앞 판이 <b>글자가 겹쳐 무너졌습니다</b> (파트너 확인).
     of.css 를 함께 불렀는데, 거기에 .im .st .a .w .m .h 같은
     <b>한 글자 이름</b>들이 이미 있어 부딪혔습니다. 벽돌 쌓기
     (column-count) 안에서 절대위치까지 겹치며 세로로 주저앉았습니다.
   ▶ of.css 를 <b>부르지 않습니다.</b> 이 화면은 확인용이라 우리 결을
     따를 까닭이 없고, 남의 규칙과 부딪히지 않는 것이 더 중요합니다.
   ▶ 이름 앞에 <b>pf-</b> 를 붙여 무엇과도 겹치지 않게 했습니다.
   ══════════════════════════════════════════════════════════════ */
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#17171A;
  font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;
  font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
.pf-wrap{max-width:1120px;margin:0 auto;padding:36px 24px 90px}
.pf-h1{font-size:28px;font-weight:600;margin:0 0 8px;letter-spacing:-.02em}
.pf-lead{color:#5C5C60;font-size:14px;margin:0 0 30px}
.pf-h2{font-size:18px;font-weight:600;margin:44px 0 6px;
  padding-top:20px;border-top:1px solid #E6E4DE}
.pf-note{font-size:13px;color:#7A7A7E;margin:0 0 16px}
.pf-note b{color:#8C3A2E}

/* ① 셈 */
.pf-cnt{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
  gap:1px;background:#E6E4DE;border:1px solid #E6E4DE}
.pf-cnt>div{background:#fff;padding:18px 10px;text-align:center;min-width:0}
.pf-k{font-size:12px;color:#5C5C60;white-space:nowrap}
.pf-v{font-size:26px;font-weight:600;margin-top:6px;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.pf-v.pf-bad{color:#8C3A2E;font-size:15px}

/* ② 도판 — 벽돌 쌓기를 <b>쓰지 않습니다</b>.
     앞 판이 무너진 자리입니다. 격자로 갑니다. */
.pf-gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:22px;margin-top:10px;align-items:start}
.pf-it{min-width:0}
.pf-im{position:relative;border:1px solid #E6E4DE;padding:8px;min-height:120px;
  display:flex;align-items:center;justify-content:center;
  background:repeating-linear-gradient(135deg,#FDFCFA,#FDFCFA 9px,#F4F3EF 9px,#F4F3EF 18px)}
.pf-im img{display:block;width:100%;height:auto;max-height:340px;object-fit:contain}
.pf-tag{position:absolute;left:8px;top:8px;z-index:2;
  font-size:11px;font-weight:700;letter-spacing:.04em;padding:4px 8px;
  background:#fff;border:1px solid #D8D6D0;white-space:nowrap}
.pf-tag.pf-ok{color:#1F4B47;border-color:#1F4B47}
.pf-tag.pf-no{color:#8C3A2E;border-color:#8C3A2E}
.pf-cap{margin-top:10px;font-size:12.5px;line-height:1.7;word-break:break-word}
.pf-cap>span{display:block}
.pf-r1{font-weight:600}
.pf-r2{color:#2A2A2E}
.pf-r3,.pf-r4{color:#8A8A8E;font-size:11.5px}
.pf-src{display:inline-block;margin-top:6px;font-size:11.5px;color:#1F4B47}

/* ③ 칸 */
.pf-tbl{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed}
.pf-tbl th{width:210px;text-align:left;padding:9px 10px;vertical-align:top;
  border-bottom:1px solid #EFEDE7;color:#7A7A7E;font-weight:600;
  font-size:11.5px;word-break:break-all}
.pf-tbl td{padding:9px 10px;border-bottom:1px solid #EFEDE7;
  word-break:break-word;vertical-align:top}

.pf-msg{border:1px solid #D8D6D0;padding:16px 18px;font-size:13px;margin-top:8px}
.pf-msg b{color:#8C3A2E}

@media(max-width:640px){
  .pf-cnt{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pf-tbl th{width:120px}
}
</style>
</head>
<body>
<div class="pf-wrap">

  <div class="pf-h1">클리블랜드 자료원 확인</div>
  <p class="pf-lead">
    수집기를 만들기 전에 셋을 눈으로 봅니다 — ① 자료를 주는가 ② 도판 주소가 오는가
    ③ <b>도판이 실제로 화면에 뜨는가</b>.
  </p>

  <div class="pf-h2">① 얼마나 있나</div>
  <p class="pf-note">CC0(저작권 풀림) · 도판 있음으로 좁힌 수입니다.</p>
  <div class="pf-cnt" id="pfCounts"></div>

  <div class="pf-h2">② 도판이 뜨는가 — <b>이 아래가 핵심입니다</b></div>
  <p class="pf-note">
    그림이 보이면 <b>뜸 ✔</b>, 사선 무늬만 남으면 <b>안 뜸 ✕</b> 입니다.
    캡션은 우리 차례(작가 / 《작품명》, 연도 / 재료 / 소장처)로 맞춰 보았습니다.
  </p>
  <div class="pf-gal" id="pfGal"></div>

  <div class="pf-h2">③ 무슨 칸을 주나</div>
  <p class="pf-note">한 점의 칸 이름과 값입니다. 수집기가 이 이름들을 씁니다.</p>
  <table class="pf-tbl"><tbody id="pfFields"></tbody></table>

  <div id="pfErr"></div>
</div>

<script>
(function () {
  'use strict';
  var API = 'https://openaccess-api.clevelandart.org/api/artworks';

  /* ★ 앞 판에서 「인도·동남아 0」이 나왔습니다. 부서 이름이 다른 듯하여
       <b>후보를 둘</b> 넣고 나오는 쪽을 씁니다. 짐작으로 하나만 박지 않습니다. */
  var DEPTS = [
    { key: 'Korean Art',   ko: '한국',   pick: 3 },
    { key: 'Chinese Art',  ko: '중국',   pick: 2 },
    { key: 'Japanese Art', ko: '일본',   pick: 2 },
    { key: 'Indian and Southeast Asian Art', ko: '인도·동남아', pick: 1,
      alt: 'Indian and South East Asian Art' }
  ];

  var counts = document.getElementById('pfCounts');
  var gal    = document.getElementById('pfGal');
  var fields = document.getElementById('pfFields');
  var errBox = document.getElementById('pfErr');
  var dumped = false;

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }
  function url(dep, limit) {
    return API + '?department=' + encodeURIComponent(dep)
         + '&cc0&has_image=1&limit=' + limit + '&skip=0';
  }
  function ask(dep, limit) {
    return fetch(url(dep, limit)).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }
  /* 이름 후보를 차례로 시도합니다 */
  function askAny(d, limit) {
    return ask(d.key, limit).then(function (j) {
      if ((!j.info || !j.info.total) && d.alt) {
        return ask(d.alt, limit).then(function (k) { k._used = d.alt; return k; });
      }
      j._used = d.key; return j;
    });
  }

  DEPTS.forEach(function (d) {
    var box = document.createElement('div');
    box.innerHTML = '<div class="pf-k">' + d.ko + '</div><div class="pf-v">…</div>';
    counts.appendChild(box);

    askAny(d, d.pick)
      .then(function (j) {
        var v = box.querySelector('.pf-v');
        v.textContent = (j.info && typeof j.info.total === 'number')
          ? j.info.total.toLocaleString() : '?';
        (j.data || []).forEach(function (w) { card(w, d.ko); });
        if (!dumped && j.data && j.data.length) { dumped = true; dump(j.data[0]); }
      })
      .catch(function (e) {
        var v = box.querySelector('.pf-v');
        v.className = 'pf-v pf-bad';
        v.textContent = '못 셈';
        blocked(e);
      });
  });

  function who(w) {
    var c = (w.creators || [])[0];
    if (!c) return (w.culture || [])[0] || '작자 미상';
    return String(c.description || '').replace(/\s*\(.*$/, '')
        || c.name_in_original_language || '작자 미상';
  }

  function card(w, ko) {
    var src = w.images && w.images.web && w.images.web.url;
    var el = document.createElement('div');
    el.className = 'pf-it';
    el.innerHTML =
      '<div class="pf-im"><span class="pf-tag">' + esc(ko) + ' · 부르는 중</span></div>' +
      '<div class="pf-cap">' +
        '<span class="pf-r1">' + esc(who(w)) + '</span>' +
        '<span class="pf-r2">《' + esc(w.title || '') + '》' +
          (w.creation_date ? ', ' + esc(w.creation_date) : '') + '</span>' +
        '<span class="pf-r3">' + esc(w.technique || '') + '</span>' +
        '<span class="pf-r4">The Cleveland Museum of Art · ' +
          esc(w.share_license_status || '') + '</span>' +
        '<a class="pf-src" href="' + esc(w.url || '#') + '" target="_blank" rel="noopener">' +
          '소장처에서 보기 →</a>' +
      '</div>';
    gal.appendChild(el);
    show(el, src, ko);
  }

  function show(el, src, ko) {
    var im = el.querySelector('.pf-im'), tag = el.querySelector('.pf-tag');
    if (!src) { tag.className = 'pf-tag pf-no'; tag.textContent = ko + ' · 주소 없음'; return; }
    var img = new Image();
    img.referrerPolicy = 'no-referrer';
    img.onload = function () {
      im.appendChild(img);
      im.style.background = 'none';
      tag.className = 'pf-tag pf-ok';
      tag.textContent = ko + ' · 뜸 ✔';
    };
    img.onerror = function () {
      tag.className = 'pf-tag pf-no';
      tag.textContent = ko + ' · 안 뜸 ✕';
    };
    img.src = src;
  }

  function dump(w) {
    ['id','accession_number','share_license_status','title',
     'title_in_original_language','creation_date','creation_date_earliest',
     'technique','department','collection','type','measurements',
     'creditline','url'].forEach(function (k) { row(k, w[k]); });
    row('creators[0].description',      ((w.creators||[])[0]||{}).description);
    row('creators[0].name_in_original', ((w.creators||[])[0]||{}).name_in_original_language);
    row('culture[0]',                   (w.culture||[])[0]);
    row('images.web.url',               ((w.images||{}).web||{}).url);
    row('external_resources.wikidata',  ((w.external_resources||{}).wikidata||[])[0]);
    row('exhibitions.legacy 수',        ((w.exhibitions||{}).legacy||[]).length);
    row('exhibitions.current 수',       ((w.exhibitions||{}).current||[]).length);
  }
  function row(k, v) {
    var tr = document.createElement('tr');
    tr.innerHTML = '<th>' + esc(k) + '</th><td>' +
      esc(v == null || v === '' ? '(없음)' : String(v).slice(0, 240)) + '</td>';
    fields.appendChild(tr);
  }

  var told = false;
  function blocked(e) {
    if (told) return;
    told = true;
    errBox.innerHTML =
      '<div class="pf-h2">브라우저에서 API 를 못 불렀습니다</div>' +
      '<div class="pf-msg">까닭: <b>' + esc(e && e.message ? e.message : e) + '</b><br><br>' +
      '이것만으로 자료원을 버리지 않습니다. 실제 수집은 <b>서버(GitHub Actions)</b>에서 하므로 ' +
      '브라우저 차단과 무관합니다. 다만 <b>도판이 뜨는지</b>는 아래 두 장으로 따로 봅니다 — ' +
      '주소를 직접 박아 두었습니다.</div>' +
      '<div class="pf-gal" id="pfGal2"></div>';
    var g2 = document.getElementById('pfGal2');
    [['1998.78.14','중국 · 송욱 《포양호》'],
     ['1953.424','유럽 · 세례 요한의 머리']].forEach(function (p) {
      var el = document.createElement('div');
      el.className = 'pf-it';
      el.innerHTML = '<div class="pf-im"><span class="pf-tag">부르는 중</span></div>' +
                     '<div class="pf-cap"><span class="pf-r1">' + esc(p[1]) + '</span></div>';
      g2.appendChild(el);
      show(el, 'https://openaccess-cdn.clevelandart.org/' + p[0] + '/' + p[0] + '_web.jpg', '도판');
    });
  }
})();
</script>
</body>
</html>
