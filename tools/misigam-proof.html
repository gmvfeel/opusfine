<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>미시감 판매작품 확인 · OPUSFINE</title>
<link rel="icon" href="/assets/ph-logo.svg">
<style>
/* ══════════════════════════════════════════════════════════════════
   OPUSFINE · 미시감 판매작품 확인 · tools/misigam-proof.html
   ------------------------------------------------------------------
   ★ 무엇을 하는가
     미시감(misg.co.kr)의 판매작품 목록을 받아 <b>카드로 늘어놓습니다.</b>
     DB 에 담지 않습니다. 오퍼스파인 자료는 하나도 건드리지 않습니다.
     여기서 모양이 마음에 들면 그대로 공개 쪽으로 옮기면 됩니다.

   ★★★ 열쇠를 <b>이 파일에 박지 않았습니다.</b>
     gmvfeel/opusfine 저장소는 <b>공개</b>입니다. msg_live_… 를 커밋하면
     GitHub 에 그대로 드러나고 자동 수집기가 집어 갑니다.
     게다가 미시감 열쇠는 서버 프록시가 막혀 있어(브라우저 전용) 숨길
     자리가 없습니다. 그래서 다른 도구의 자물쇠 칸과 같은 방식으로,
     파트너가 붙여 넣으면 <b>창을 닫을 때까지만</b> 기억합니다.
     (sessionStorage — 창을 닫으면 사라집니다)

   ★ of.css 를 부르지 않습니다. 관리 화면은 제 꾸밈을 안에 지닙니다.
     색과 글꼴만 of.css 와 같은 것을 씁니다.

   ★ 알아 둘 것 (2026-09-15 재어 본 것)
     · 전체 18점 · 작가 5명 · 판매중 9 / 판매완료 9
     · 걸러 받는 기능이 <b>없습니다</b> — page·limit 뿐입니다.
       그래서 다 받아 와서 이 화면에서 거릅니다. 작품이 수백 점이
       되면 이 방식은 못 버팁니다. 그때 미시감에 필터를 청하십시오.
     · 안내문에는 허용 도메인이 localhost 뿐이라 적혀 있는데,
       실제로는 opusfine.vercel.app 에서도 열립니다(200 확인).
       <b>언제 조여질지 모릅니다</b> — 403 이 나면 그 까닭입니다.
   ══════════════════════════════════════════════════════════════════ */

:root{
  --paper:#FBFAF7; --ink:#17171A; --ink-2:#5F5F64; --ink-3:#95949A;
  --rule:#E5E3DC; --nok:#1F4B47; --nok-pale:#E9F0EE;
  --gold:#A8863C; --warn:#8C3A2B;
  --serif:'Noto Serif KR',serif;
  --sans:'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font:15px/1.75 var(--sans);word-break:keep-all;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--nok);outline-offset:3px;border-radius:3px}

.wrap{max-width:1040px;margin:0 auto;padding:30px 22px 90px}
.back{font-size:13px;color:var(--ink-2);text-decoration:none}
.back:hover{color:var(--nok)}
h1{margin:14px 0 6px;font-family:var(--serif);font-size:25px;font-weight:600}
.lede{margin:0 0 26px;font-size:13.5px;color:var(--ink-2);line-height:1.8}

/* ── 열쇠 칸 ── */
.key{border:1px solid var(--rule);border-radius:9px;padding:17px 19px;background:#fff;margin:0 0 26px}
.key h2{margin:0 0 3px;font-family:var(--serif);font-size:15px;font-weight:600}
.key p{margin:0 0 12px;font-size:12.5px;color:var(--ink-2);line-height:1.75}
.key .row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
input[type=password],input[type=text]{
  flex:1 1 320px;min-width:0;padding:9px 11px;border:1px solid var(--rule);
  border-radius:6px;font:13px/1.5 ui-monospace,Menlo,monospace;background:#fff;color:var(--ink)}
button{
  padding:9px 17px;border:1px solid var(--ink);border-radius:6px;background:var(--ink);
  color:#fff;font:600 13.5px/1 var(--sans);cursor:pointer}
button.ghost{background:#fff;color:var(--ink)}
button:disabled{opacity:.45;cursor:default}
.key .ok{font-size:12.5px;color:var(--nok);font-weight:600}
.key .no{font-size:12.5px;color:var(--warn);font-weight:600}

/* ── 고르기 띠 ── */
.bar{display:flex;gap:9px;flex-wrap:wrap;align-items:baseline;
  margin:0 0 6px;padding-bottom:9px;border-bottom:1px solid var(--rule)}
.bar .sum{font-family:var(--serif);font-size:15.5px;font-weight:600}
.bar .sum b{color:var(--nok);font-variant-numeric:tabular-nums}
.bar .sp{flex:1}
.bar button{padding:6px 12px;font-size:12.5px}
.bar button[aria-pressed=true]{background:var(--nok);border-color:var(--nok);color:#fff}
.bar button[aria-pressed=false]{background:#fff;color:var(--ink-2);border-color:var(--rule)}

/* ── 작품 카드 ── */
ul.grid{list-style:none;margin:22px 0 0;padding:0;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:26px 20px}
ul.grid li{min-width:0}
.card{display:block;text-decoration:none}
.shot{
  position:relative;aspect-ratio:1/1;background:#EFEDE7;border:1px solid var(--rule);
  border-radius:4px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.shot img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s}
.card:hover .shot img{transform:scale(1.035)}
.shot .none{font-size:12px;color:var(--ink-3)}
.badge{
  position:absolute;left:8px;top:8px;padding:3px 8px;border-radius:3px;
  font:600 11.5px/1.5 var(--sans);letter-spacing:.02em}
.badge.on{background:var(--nok);color:#fff}
.badge.sold{background:#3A3A3E;color:#D9D8D4}
.ttl{margin:10px 0 2px;font-family:var(--serif);font-size:15px;font-weight:600;line-height:1.5}
.who{margin:0;font-size:12.5px;color:var(--ink-2)}
.sum2{margin:5px 0 0;font-size:12.5px;color:var(--ink-3);line-height:1.6}
.won{margin:6px 0 0;font-size:13.5px;font-weight:600;color:var(--gold);
  font-variant-numeric:tabular-nums}
.won.sold{color:var(--ink-3);text-decoration:line-through}

/* ── 알림 ── */
.msg{margin:26px 0 0;padding:14px 16px;border-left:3px solid var(--gold);
  background:#FBF7EE;font-size:13px;color:#6B5A31;line-height:1.85}
.msg.bad{border-left-color:var(--warn);background:#FBF0EE;color:#7A3325}
.msg code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.hide{display:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <a class="back" href="/admin/">← 작업실</a>
  <h1>미시감 판매작품 확인</h1>
  <p class="lede">
    미시감에서 팔리는 작품을 받아 늘어놓습니다. <b>담지 않습니다</b> —
    오퍼스파인 자료는 하나도 건드리지 않습니다.
    모양이 마음에 들면 이 카드를 그대로 공개 쪽으로 옮기면 됩니다.
  </p>

  <!-- ══ 열쇠 ══════════════════════════════════════════════════ -->
  <div class="key">
    <h2>미시감 열쇠</h2>
    <p>
      <code>msg_live_</code> 로 시작하는 글자입니다. 이 칸에만 잠깐 머물고
      <b>저장소에는 들어가지 않습니다</b>(창을 닫으면 사라집니다).
      저장소가 공개라서 파일에 박아 둘 수 없습니다.
    </p>
    <div class="row">
      <input id="key" type="password" autocomplete="off" spellcheck="false"
             placeholder="msg_live_…">
      <button id="go">받아 오기</button>
      <button id="clr" class="ghost">지우기</button>
      <span id="keyState"></span>
    </div>
  </div>

  <!-- ══ 결과 ══════════════════════════════════════════════════ -->
  <div id="result" class="hide">
    <div class="bar">
      <span class="sum" id="sum"></span>
      <span class="sp"></span>
      <button id="fAll"  aria-pressed="true">전체</button>
      <button id="fOn"   aria-pressed="false">판매 중만</button>
    </div>
    <ul class="grid" id="grid"></ul>
  </div>

  <div id="msg" class="hide"></div>

</div>

<script>
/* ══════════════════════════════════════════════════════════════════
   미시감 판매작품 받아 늘어놓기
   ------------------------------------------------------------------
   ★ 열쇠는 sessionStorage 에만 둡니다. localStorage 가 아닙니다 —
     창을 닫으면 지워지는 쪽이 안전합니다.
   ★ 걸러 받는 기능이 없으므로 has_more 를 따라가며 <b>전부</b> 받고,
     거르기는 이 화면에서 합니다. 쪽이 20장을 넘으면 멈춥니다
     (끝없이 도는 것을 막는 안전장치).
   ══════════════════════════════════════════════════════════════════ */
(function () {
  'use strict';

  var API   = 'https://misg.co.kr/api/public/artworks';
  var SKEY  = 'of_misigam_key';
  var 전부  = [];
  var 보임  = 'all';

  var $ = function (id) { return document.getElementById(id); };

  /* ── 열쇠 되살리기 ── */
  var saved = sessionStorage.getItem(SKEY);
  if (saved) { $('key').value = saved; say('열쇠가 남아 있습니다', true); }

  function say(t, good) {
    $('keyState').textContent = t;
    $('keyState').className = good ? 'ok' : 'no';
  }

  function alert2(html, bad) {
    var m = $('msg');
    m.innerHTML = html;
    m.className = bad ? 'msg bad' : 'msg';
  }

  function 원(n) {
    if (n === null || n === undefined) return '가격 미정';
    return Number(n).toLocaleString('ko-KR') + '원';
  }

  /* ── 한 쪽 받기 ── */
  async function 한쪽(key, page) {
    var r = await fetch(API + '?page=' + page + '&limit=50', {
      headers: { 'x-api-key': key }
    });
    if (!r.ok) {
      var code = '';
      try { code = (await r.json()).error.code; } catch (e) { code = '(까닭 모름)'; }
      var 풀이 = {
        invalid_key:        '열쇠가 없거나 틀렸거나 폐기되었습니다. 값을 다시 확인하십시오.',
        origin_not_allowed: '이 주소에서는 부를 수 없다고 합니다. 미시감 쪽에 '
                          + location.origin + ' 를 허용 도메인으로 넣어 달라고 청하십시오.',
        query_failed:       '미시감 쪽 조회가 실패했습니다. 잠시 뒤 다시 해 보십시오.'
      }[code] || '뜻을 모르는 오류입니다.';
      throw new Error('HTTP ' + r.status + ' · ' + code + ' — ' + 풀이);
    }
    return r.json();
  }

  /* ── 다 받기 ── */
  async function 다받기() {
    var key = $('key').value.trim();
    if (!key) { say('열쇠를 넣으십시오', false); return; }

    sessionStorage.setItem(SKEY, key);
    $('go').disabled = true;
    say('받는 중…', true);
    alert2('', false); $('msg').className = 'hide';

    전부 = [];
    try {
      var page = 1, total = null;
      while (page <= 20) {
        var j = await 한쪽(key, page);
        전부 = 전부.concat(j.data || []);
        total = j.total;
        if (!j.has_more) break;
        page++;
      }
      say('받았습니다', true);

      if (!전부.length) {
        $('result').className = 'hide';
        alert2('열쇠는 통했는데 <b>작품이 하나도 없습니다.</b> '
             + '미시감에 올라온 것이 없거나 모두 내려간 상태입니다.', false);
        return;
      }
      그리기();
      if (total !== null && total !== 전부.length) {
        alert2('미시감이 알려 준 전체 수(<b>' + total + '</b>)와 '
             + '실제로 받은 수(<b>' + 전부.length + '</b>)가 다릅니다. '
             + '쪽을 넘기는 사이에 목록이 바뀌었을 수 있습니다.', false);
      }
    } catch (e) {
      $('result').className = 'hide';
      alert2(String(e.message || e), true);
      say('실패', false);
    } finally {
      $('go').disabled = false;
    }
  }

  /* ── 늘어놓기 ── */
  function 그리기() {
    var 판매중 = 전부.filter(function (x) { return x.status === 'on_sale'; });
    var 볼것  = (보임 === 'on') ? 판매중 : 전부;
    var 작가수 = new Set(전부.map(function (x) {
      return (x.artist && x.artist.id) || '?';
    })).size;

    $('sum').innerHTML =
      '작품 <b>' + 전부.length + '</b>점 · 판매 중 <b>' + 판매중.length + '</b>점 · '
      + '작가 <b>' + 작가수 + '</b>명';

    var g = $('grid');
    g.innerHTML = '';

    볼것.forEach(function (x) {
      var 팔림 = x.status === 'sold';
      var img  = (x.images && x.images[0]) || '';

      var li = document.createElement('li');
      var a  = document.createElement('a');
      a.className = 'card';
      a.href = x.url || '#';
      a.target = '_blank';
      a.rel = 'noopener';

      var shot = document.createElement('div');
      shot.className = 'shot';
      if (img) {
        var im = document.createElement('img');
        im.src = img;
        im.alt = (x.title || '') + (x.artist ? ' — ' + x.artist.name : '');
        im.loading = 'lazy';
        im.onerror = function () {
          shot.innerHTML = '<span class="none">도판이 안 뜹니다</span>';
        };
        shot.appendChild(im);
      } else {
        shot.innerHTML = '<span class="none">도판 없음</span>';
      }
      var b = document.createElement('span');
      b.className = 'badge ' + (팔림 ? 'sold' : 'on');
      b.textContent = 팔림 ? '판매 완료' : '판매 중';
      shot.appendChild(b);
      a.appendChild(shot);

      var h = document.createElement('p');
      h.className = 'ttl';
      h.textContent = x.title || '(제목 없음)';
      a.appendChild(h);

      var w = document.createElement('p');
      w.className = 'who';
      w.textContent = (x.artist && x.artist.name) || '작가 미상';
      a.appendChild(w);

      if (x.summary) {
        var s = document.createElement('p');
        s.className = 'sum2';
        s.textContent = x.summary;
        a.appendChild(s);
      }

      var p = document.createElement('p');
      p.className = 'won' + (팔림 ? ' sold' : '');
      p.textContent = 원(x.price);
      a.appendChild(p);

      li.appendChild(a);
      g.appendChild(li);
    });

    $('result').className = '';
  }

  /* ── 단추 ── */
  $('go').addEventListener('click', 다받기);
  $('key').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') 다받기();
  });
  $('clr').addEventListener('click', function () {
    sessionStorage.removeItem(SKEY);
    $('key').value = '';
    전부 = [];
    $('result').className = 'hide';
    $('msg').className = 'hide';
    say('지웠습니다', true);
  });
  function 골라(v) {
    보임 = v;
    $('fAll').setAttribute('aria-pressed', String(v === 'all'));
    $('fOn').setAttribute('aria-pressed',  String(v === 'on'));
    if (전부.length) 그리기();
  }
  $('fAll').addEventListener('click', function () { 골라('all'); });
  $('fOn').addEventListener('click',  function () { 골라('on'); });
})();
</script>

</body>
</html>
